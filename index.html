<!DOCTYPE html>
<html>
  <head>
    <title>Ejemplo de cadenas</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Ejemplo para el manejo de cadenas</h1>
    <h2>Captura de un nuevo cliente o texto a convertir</h2>

    <div class="contenedor">
      <div class="caja">
        <label>Ingresa el nombre o nombres</label>
        <input type="text" id="cajaNombre"></input>
      </div>
      <div class="caja">
        <label>Ingresa el apellido paterno</label>
        <input type="text" id="cajaApellidoPaterno"></input>
      </div>
      <div class="caja">
        <label>Ingresa el apellido materno</label>
        <input type="text" id="cajaApellidoMaterno"></input>
      </div>
      <button onclick="concatenarCadenas()">Generar nombre completo</button>
      <script src="cadena.js"></script>
      <div class="caja">
        <label>El nombre completo es</label>
        <input type="text" id="cajaNombreCompleto" disabled></input>
      </div>
      <div class="caja">
        <label>Ingresa un texto largo</label>
        <textarea id="cajaTextoLargo" rows="4"></textarea>
      </div>
      <button onclick="document.getElementById('cajaLongitudTexto').value=longitudTexto(document.getElementById('cajaTextoLargo').value)">Calcular longitud</button>
      <div class="caja">
        <label>La longitud del texto es</label>
        <input type="text" id="cajaLongitudTexto" disabled></input>
      </div>
      <div class="caja">
        <label>Ingresa un texto largo</label>
        <textarea id="cajaTextoLargoExtra" rows="4"></textarea>
      </div>
      <button onclick="document.getElementById('cajaTextoConvertido').value=textoAMayusculas(document.getElementById('cajaTextoLargoExtra').value)">Convertir a mayusculas</button>
      <button onclick="document.getElementById('cajaTextoConvertido').value=textoAMinusculas(document.getElementById('cajaTextoLargoExtra').value)">Convertir a minusculas</button>
      <div class="caja">
        <label>Texto convertido</label>
        <textarea id="cajaTextoConvertido" rows="4" disabled></textarea>
      </div>
      <div class="caja">
        <label>Selecciona una fecha</label>
        <div class="columna-fecha">
          <input type="number" id="cajaDia" min="1" max="31" placeholder="Día"></input>
          <input type="number" id="cajaMes" min="1" max="12" placeholder="Mes"></input>
          <input type="number" id="cajaAnio" min="0" max="9999" placeholder="Año"></input>
        </div>
      </div>
      <button onclick="document.getElementById('cajaFechaFormateada').value=formatearFechaDDMMAA(document.getElementById('cajaDia').value, document.getElementById('cajaMes').value, document.getElementById('cajaAnio').value)">Cambiar fecha</button>
      <div class="caja">
        <label>Fecha en formato DD/MM/AA</label>
        <input type="text" id="cajaFechaFormateada" disabled></input>
      </div>
    </div>

  </body>
</html>
